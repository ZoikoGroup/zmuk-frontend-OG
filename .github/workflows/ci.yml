name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Set up Python (for Semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (strict, matches lockfile exactly)
        run: npm ci

      - name: Security audit (fails only on high/critical)
        run: npm audit --audit-level=high

      - name: Static code analysis (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --error

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
