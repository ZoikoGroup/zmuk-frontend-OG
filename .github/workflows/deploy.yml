name: Deploy to GCP VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b2d72a5b5f # v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /var/www/zoiko-mobile-uk-frontend/app
            git pull origin main
            npm ci
            npm audit --audit-level=high
            npm run build
            pm2 restart zoiko-mobile-uk
            pm2 save