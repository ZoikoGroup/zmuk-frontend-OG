name: Deploy to GCP VM

on:
  push:
    branches: [main]

# Only one deploy at a time. Back-to-back merges otherwise run `npm ci` and
# `next build` concurrently in the same server directory, and one run deletes
# node_modules while the other is building ("next: not found").
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /var/www/zoiko-mobile-uk-frontend/app
            git pull origin main
            npm ci
            npm run build
            pm2 restart zoiko-mobile-uk
            pm2 save
