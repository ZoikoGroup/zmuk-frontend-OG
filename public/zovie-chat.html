<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zovie Assistant – Zoiko Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   RESET & ROOT
═══════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p1:#E5125A;--p2:#F0346F;--p3:#B80D47;
  --tint:#FDECF2;--tint2:#FFF5F8;
  --bg:#f4f5f7;--card:#fff;--border:#eceef2;
  --txt:#111827;--sub:#6b7280;--font:'Inter',Segoe UI,sans-serif;
  /* topic tile colours */
  --t-plans:#E5125A;--t-sim:#F7781F;--t-num:#1FA34A;--t-bill:#7B3FE4;
  --t-net:#1E6FE0;--t-roam:#E5254B;--t-disc:#F7781F;--t-biz:#17A34A;--t-other:#9ca3af;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt)}
button{font-family:var(--font)}

/* ═══════════════════════════════════════════════════
   FAB TOGGLE BUTTON (standalone page only)
═══════════════════════════════════════════════════ */
#chat-toggle{
  position:fixed;bottom:26px;right:26px;
  width:66px;height:66px;border-radius:50%;
  background:var(--p1);
  color:#fff;border:none;font-size:28px;cursor:pointer;
  box-shadow:0 10px 32px rgba(229,18,90,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:9990;transition:transform .2s,box-shadow .2s;
}
#chat-toggle:hover{transform:scale(1.08)}
#fab-dot{
  position:absolute;top:-3px;right:-3px;
  width:22px;height:22px;border-radius:50%;
  background:#111827;color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:2.5px solid #fff;
}

/* ═══════════════════════════════════════════════════
   CHAT WINDOW
═══════════════════════════════════════════════════ */
#chatbot{
  position:fixed;bottom:108px;right:26px;
  width:440px;height:680px;
  border-radius:24px;display:none;flex-direction:column;
  background:#fff;
  box-shadow:0 24px 80px rgba(17,24,39,.25);
  z-index:9991;overflow:hidden;
  transform:scale(.92) translateY(24px);opacity:0;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .24s ease;
  max-height:calc(100vh - 128px);
}
#chatbot.open{display:flex}
#chatbot.visible{transform:scale(1) translateY(0);opacity:1}

/* ═══════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════ */
#header{
  background:var(--p1);
  padding:16px 14px 16px 18px;
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;position:relative;
}
.header-left{display:flex;gap:14px;align-items:center;min-width:0}
.header-av{
  width:52px;height:52px;border-radius:50%;
  background:#fff;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:var(--p1);
}
.header-av img{width:100%;height:100%;object-fit:contain;padding:6px}
.header-info{min-width:0}
.hname{color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.15}
.hname .spark{color:#FFD84D;font-size:16px}
.hsub{color:rgba(255,255,255,.88);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.online-pill{
  display:none;align-items:center;gap:6px;
  background:#E8F7EE;color:#15803d;font-size:13px;font-weight:600;
  padding:6px 12px;border-radius:999px;white-space:nowrap;
}
.online-pill::before{content:'';width:8px;height:8px;border-radius:50%;background:#16a34a}
.header-actions{display:flex;gap:2px;align-items:center;flex-shrink:0}
.hbtn{
  background:none;border:none;cursor:pointer;
  color:#fff;
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.hbtn:hover{background:rgba(255,255,255,.18)}
.hbtn:focus-visible{outline:2px solid #fff;outline-offset:1px}
.hbtn svg{width:22px;height:22px}

/* ── "…" dropdown ── */
#menu-pop{
  position:absolute;top:72px;right:14px;z-index:20;
  background:#fff;border-radius:14px;min-width:200px;padding:6px;
  box-shadow:0 12px 36px rgba(17,24,39,.18);
  display:none;
}
#menu-pop.show{display:block}
#menu-pop button{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:none;cursor:pointer;text-align:left;
  padding:10px 12px;border-radius:10px;font-size:14px;color:var(--txt);
}
#menu-pop button:hover{background:var(--tint2)}
#menu-pop svg{width:18px;height:18px;color:var(--p1);flex-shrink:0}

/* ═══════════════════════════════════════════════════
   MESSAGES AREA
═══════════════════════════════════════════════════ */
#messages{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:18px 16px 12px;
  background:#fff;
  min-height:0;
  scroll-behavior:smooth;
}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:rgba(229,18,90,.2);border-radius:4px}

/* ═══════════════════════════════════════════════════
   BOT ROW & BUBBLES
═══════════════════════════════════════════════════ */
.bot-row{
  display:flex;gap:10px;margin-bottom:2px;
  animation:mi .2s ease;
}
@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.ba{/* bot avatar */
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  overflow:hidden;background:#fff;
  display:flex;align-items:center;justify-content:center;
  align-self:flex-start;
  box-shadow:0 1px 6px rgba(17,24,39,.12);
  font-size:18px;font-weight:900;color:var(--p1);
}
.ba img{width:100%;height:100%;object-fit:contain;padding:5px}

.bot-bubble{
  background:var(--tint);padding:13px 16px;
  border-radius:4px 16px 16px 16px;
  max-width:calc(100% - 50px);font-size:14.5px;line-height:1.55;
  color:var(--txt);word-break:break-word;
}
.bot-bubble strong.hello{display:block;font-size:16.5px;margin-bottom:2px}
.bot-bubble a{color:var(--p1);font-weight:600}

/* numbered steps inside a bot bubble */
.steps{
  list-style:none;background:#fff;border-radius:12px;
  padding:6px 12px;margin:10px 0;
}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13.5px;line-height:1.45}
.steps li+li{border-top:1px solid #f6f0f3}
.steps .n{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:var(--p1);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.ts{font-size:11.5px;color:#9ca3af;margin:4px 0 12px 50px}
.ts.right{text-align:right;margin:4px 2px 12px 0}
.ts .tick{color:var(--p1);margin-left:4px;font-weight:700;letter-spacing:-3px}

.user-bubble{
  background:var(--p1);
  color:#fff;padding:11px 18px;
  border-radius:16px 4px 16px 16px;
  margin-left:auto;width:fit-content;
  max-width:80%;font-size:14.5px;font-weight:500;word-break:break-word;
  animation:mi .2s ease;
}

/* ═══════════════════════════════════════════════════
   ACTION BUTTONS (quick replies)
═══════════════════════════════════════════════════ */
.quick{
  display:flex;flex-wrap:wrap;gap:8px;
  margin:2px 0 12px 50px;
}
.qbtn{
  border:1.5px solid var(--p1);
  background:#fff;color:var(--p1);
  padding:9px 16px;border-radius:10px;
  cursor:pointer;font-size:13.5px;
  font-weight:600;transition:all .15s ease;
  flex:1 1 auto;text-align:center;
}
.qbtn:hover{background:var(--p1);color:#fff}
.qbtn:disabled{opacity:.4;cursor:not-allowed;background:#fff;color:var(--p1)}
.qbtn.cta-btn{background:var(--p1);color:#fff}
.qbtn.cta-btn:hover{background:var(--p3);border-color:var(--p3)}
.qbtn.link::after{content:' ›';font-weight:700}

/* ═══════════════════════════════════════════════════
   HOME: TOPIC GRID
═══════════════════════════════════════════════════ */
.topics{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin:14px 0 12px;animation:mi .2s ease;
}
.topic{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--border);border-radius:14px;
  padding:12px 10px;cursor:pointer;text-align:left;
  box-shadow:0 1px 3px rgba(17,24,39,.04);
  transition:border-color .15s,box-shadow .15s,transform .15s;
}
.topic:hover{border-color:rgba(229,18,90,.4);box-shadow:0 4px 14px rgba(229,18,90,.1);transform:translateY(-1px)}
.topic:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
.t-ico{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.t-ico svg{width:24px;height:24px}
.t-txt{flex:1;min-width:0}
.t-lbl{display:block;font-size:13.5px;font-weight:600;color:var(--txt);line-height:1.3}
.t-desc{display:block;font-size:12px;color:var(--sub);line-height:1.35;margin-top:2px}
.t-arrow{color:var(--p1);font-size:20px;flex-shrink:0;line-height:1}
.topic.other{display:none}

/* ── Popular questions (mobile) ── */
.popular{display:none;margin:4px 0 14px;animation:mi .2s ease}
.pop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pop-head h3{font-size:15px;font-weight:700}
.pop-head button{background:none;border:none;color:var(--p1);font-size:13px;font-weight:600;cursor:pointer}
.pop-q{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;margin-bottom:6px;cursor:pointer;
  font-size:13.5px;color:#374151;text-align:left;
}
.pop-q::after{content:'›';color:var(--p1);font-size:18px;font-weight:600}
.pop-q:hover{border-color:rgba(229,18,90,.4)}

/* ── Speak to a human ── */
.human{
  display:flex;align-items:center;gap:14px;width:100%;
  background:#fff;border:1.5px solid var(--p1);border-radius:14px;
  padding:12px 16px;cursor:pointer;text-align:left;margin-bottom:6px;
  animation:mi .2s ease;transition:background .15s;
}
.human:hover{background:var(--tint2)}
.human .h-ico{color:var(--p1);flex-shrink:0}
.human .h-ico svg{width:30px;height:30px}
.human .h-txt{flex:1;text-align:center}
.human .h-lbl{display:block;color:var(--p1);font-size:15px;font-weight:600}
.human .h-hrs{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.human .t-arrow{font-size:22px}

/* ── "Still need help?" handover card ── */
.handover{
  display:flex;align-items:center;gap:12px;width:100%;
  background:#fff;border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;margin:4px 0 12px;cursor:pointer;text-align:left;
  box-shadow:0 2px 10px rgba(17,24,39,.06);animation:mi .2s ease;
}
.handover:hover{border-color:rgba(229,18,90,.4)}
.handover .t-ico{background:var(--t-sim);width:40px;height:40px}
.handover .ho-lbl{display:block;font-size:14px;font-weight:600;color:var(--txt)}
.handover .ho-sub{display:block;font-size:12.5px;color:#374151;margin-top:1px}

/* ═══════════════════════════════════════════════════
   3-OPTION CHOICE CARD
═══════════════════════════════════════════════════ */
.choice-card{
  background:#fff;border-radius:16px;border:1px solid var(--border);
  box-shadow:0 2px 12px rgba(17,24,39,.06);
  overflow:hidden;margin:6px 0 12px 50px;
  max-width:calc(100% - 50px);
  animation:mi .2s ease;
}
.choice-btn{
  display:flex;align-items:center;gap:13px;
  width:100%;padding:14px 16px;
  border:none;border-bottom:1px solid #f3f4f6;
  background:#fff;cursor:pointer;
  transition:background .15s ease;text-align:left;
}
.choice-btn:last-child{border-bottom:none}
.choice-btn:hover{background:var(--tint2)}
.choice-btn.cta{background:var(--p1);border-bottom:none}
.choice-btn.cta:hover{background:var(--p3)}
.choice-ico{
  width:42px;height:42px;border-radius:12px;
  background:var(--tint);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;flex-shrink:0;
}
.choice-btn.cta .choice-ico{background:rgba(255,255,255,.2)}
.choice-txt{flex:1;min-width:0}
.choice-lbl{font-size:14px;font-weight:700;color:var(--txt);display:block;margin-bottom:2px}
.choice-desc{font-size:11.5px;color:var(--sub);display:block;line-height:1.4}
.choice-btn.cta .choice-lbl{color:#fff}
.choice-btn.cta .choice-desc{color:rgba(255,255,255,.85)}
.choice-arrow{font-size:16px;color:#d1d5db;flex-shrink:0}
.choice-btn.cta .choice-arrow{color:rgba(255,255,255,.8)}
.choice-btn:hover .choice-arrow{color:var(--p1)}
.choice-btn.cta:hover .choice-arrow{color:#fff}

/* ═══════════════════════════════════════════════════
   PLAN CARDS — VERTICAL STACK
═══════════════════════════════════════════════════ */
.plan-stack{
  display:flex;flex-direction:column;gap:12px;
  margin:6px 0 12px 50px;
  max-width:calc(100% - 50px);
}
.plan-card{
  background:#fff;border-radius:16px;
  box-shadow:0 2px 12px rgba(17,24,39,.07);
  overflow:hidden;border:1.5px solid var(--border);
  transition:border-color .2s,transform .15s,box-shadow .2s;
  width:100%;
}
.plan-card:hover{border-color:var(--p2);transform:translateY(-2px);box-shadow:0 6px 24px rgba(229,18,90,.15)}
.plan-card.popular{border-color:var(--p1)}
.plan-badge{
  background:var(--p1);
  color:#fff;font-size:12.5px;font-weight:700;
  padding:7px 16px;display:flex;align-items:center;gap:6px;
}
.plan-body{padding:16px 18px 14px}
.plan-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.plan-name{font-size:15.5px;font-weight:800;color:var(--txt)}
.plan-data{
  font-size:12px;font-weight:700;padding:4px 12px;border-radius:18px;
  background:var(--tint);color:var(--p3);
}
.plan-data.unl{background:#e0f2fe;color:#0369a1}
.plan-price{font-size:30px;font-weight:900;color:var(--txt);margin-bottom:12px;line-height:1.05}
.plan-price span{font-size:14px;font-weight:500;color:var(--sub)}
.plan-hr{border:none;border-top:1.5px solid #f3f4f6;margin-bottom:12px}
.plan-feats{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.plan-feats li{font-size:13.5px;color:#374151;display:flex;align-items:flex-start;gap:9px;line-height:1.45}
.plan-feats li .fi{font-size:13px;flex-shrink:0;margin-top:1px}
.plan-buy{
  display:block;width:100%;padding:13px;
  background:var(--p1);
  color:#fff;border:none;border-radius:10px;
  font-size:14.5px;font-weight:700;cursor:pointer;
  text-align:center;text-decoration:none;
  transition:background .2s,transform .15s;
}
.plan-buy:hover{background:var(--p3);transform:translateY(-1px)}

/* ═══════════════════════════════════════════════════
   REVIEW SECTION
═══════════════════════════════════════════════════ */
.kpi-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;
  margin:6px 0 12px 50px;max-width:calc(100% - 50px);
}
.kpi-card{
  background:#fff;border-radius:12px;padding:14px;border:1px solid var(--border);
  text-align:center;
}
.kpi-num{font-size:24px;font-weight:900;color:var(--p1);display:block;line-height:1.1}
.kpi-lbl{font-size:11px;color:var(--sub);font-weight:600;margin-top:4px;line-height:1.3}

.review-stack{
  display:flex;flex-direction:column;gap:9px;
  margin:6px 0 12px 50px;max-width:calc(100% - 50px);
}
.review-card{
  background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--border);width:100%;
}
.rv-stars{color:#f59e0b;font-size:17px;margin-bottom:7px;letter-spacing:1px}
.rv-text{font-size:13px;color:#374151;line-height:1.55;margin-bottom:8px;font-style:italic}
.rv-author{font-size:12.5px;font-weight:700;color:var(--p1)}
.rv-date{font-size:11px;color:var(--sub);margin-top:1px}

/* ═══════════════════════════════════════════════════
   TYPING DOTS
═══════════════════════════════════════════════════ */
#typing{display:none;align-items:flex-start;gap:10px;margin-bottom:12px}
.typing-bub{
  background:var(--tint);border-radius:4px 16px 16px 16px;
  padding:14px 16px;
  display:flex;gap:5px;align-items:center;
}
.typing-bub .d{width:8px;height:8px;background:var(--p2);border-radius:50%;animation:td 1.35s infinite}
.typing-bub .d:nth-child(2){animation-delay:.18s}
.typing-bub .d:nth-child(3){animation-delay:.36s}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}

/* ═══════════════════════════════════════════════════
   MIC STATUS
═══════════════════════════════════════════════════ */
#mic-status{
  font-size:11.5px;color:var(--p1);text-align:center;
  padding:0 12px;min-height:0;background:#fff;
  font-weight:600;
}
#mic-status:not(:empty){padding:4px 12px}

/* ═══════════════════════════════════════════════════
   INPUT AREA
═══════════════════════════════════════════════════ */
#input-area{
  display:flex;gap:10px;padding:12px 16px 8px;
  border-top:1px solid var(--border);background:#fff;flex-shrink:0;
  align-items:center;
}
.input-wrap{
  flex:1;background:#fff;border-radius:26px;
  display:flex;align-items:center;
  border:1px solid #e5e7eb;transition:border-color .2s;
  overflow:hidden;min-height:50px;
}
.input-wrap:focus-within{border-color:rgba(229,18,90,.5)}
#user-input{
  flex:1;padding:13px 18px;border:none;background:transparent;
  font-size:15px;outline:none;color:var(--txt);font-family:var(--font);
  resize:none;max-height:100px;line-height:1.5;
}
#user-input::placeholder{color:#6b7280}
#user-input:disabled{opacity:.55}
.ib{/* icon button */
  width:50px;height:50px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .18s ease;
}
.ib:active{transform:scale(.93)}
#mic{background:#fff;border:1px solid #e5e7eb;color:#6b7280}
#mic:hover{color:var(--p1);border-color:rgba(229,18,90,.5)}
#mic svg{width:22px;height:22px}
#mic.listening{background:var(--p1);border-color:var(--p1);color:#fff}
#send{background:var(--p1);border:none;color:#fff;box-shadow:0 4px 14px rgba(229,18,90,.35)}
#send:hover{background:var(--p3)}
#send:disabled{opacity:.6;cursor:not-allowed}
#send svg{width:24px;height:24px}
.zsafe{
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;color:#4b5563;
  padding:2px 12px 12px;background:#fff;flex-shrink:0;text-align:center;
}
.zsafe svg{width:15px;height:15px;flex-shrink:0;color:#4b5563}
.zsafe a{color:#111827;text-decoration:underline;cursor:pointer}

/* ═══════════════════════════════════════════════════
   MUTE TOAST
═══════════════════════════════════════════════════ */
#mute-toast{
  position:absolute;top:96px;left:50%;transform:translateX(-50%);
  background:rgba(17,24,39,.8);color:#fff;
  font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;
}
#mute-toast.show{opacity:1}

/* ═══════════════════════════════════════════════════
   RATING WIDGET
═══════════════════════════════════════════════════ */
.rating-wrap{
  background:#fff;border-radius:16px;padding:18px 20px;border:1px solid var(--border);
  box-shadow:0 2px 12px rgba(17,24,39,.06);
  margin:6px 0 12px 50px;max-width:calc(100% - 50px);
  animation:mi .2s ease;
}
.rating-wrap .rt{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:3px}
.rating-wrap .rs{font-size:12px;color:var(--sub);margin-bottom:12px}
.star-row{display:flex;gap:7px}
.star{font-size:32px;cursor:pointer;color:#e5e7eb;transition:all .14s;background:none;border:none;padding:2px}
.star.active{color:#f59e0b;transform:scale(1.12)}
.feedback-form{

   EMBED MODE + NAVIGATION
   The website loads this page in an iframe with ?embed=1 and
   provides the floating toggle. Links are handed to the parent
   website (single page app) so navigation happens in the same
   tab; otherwise they open in a new tab.
══════════════════════════════════════════════════════ */
const EMBED = new URLSearchParams(location.search).has('embed')

function openUrl(url){
  if (EMBED && window.parent !== window) {
    try {
      const u = new URL(url, location.origin)
      const internal = u.origin === location.origin || u.hostname.endsWith('zoikomobile.co.uk')
      const path = internal ? u.pathname + u.search + u.hash : u.href
      window.parent.postMessage({ type:'zovie:navigate', url:path }, '*')
      return
    } catch(e){}
  }
  window.open(url, '_blank')
}

/* ── Tell the parent website to hide the panel ── */
function hidePanel() {
  if (EMBED && window.parent !== window) {
    speechSynthesis.cancel()
    if (recog && isListening) recog.stop()
    window.parent.postMessage({ type:'zovie:close' }, '*')
  } else {
    closeChat()
  }
}

let isMuted = false
let muteToastTimer = null

function toggleMenu(show) {
  const v = show !== undefined ? show : !menuPop.classList.contains('show')
  menuPop.classList.toggle('show', v)
  moreB.setAttribute('aria-expanded', String(v))
}
moreB.addEventListener('click', e => { e.stopPropagation(); toggleMenu() })
document.addEventListener('click', e => { if (!menuPop.contains(e.target)) toggleMenu(false) })

function toggleMute() {
  isMuted = !isMuted
  muteLbl.textContent = isMuted ? 'Unmute voice' : 'Mute voice'
  muteToast.textContent = isMuted ? '🔇 Voice muted' : '🔊 Voice on'
  muteToast.classList.add('show')
  clearTimeout(muteToastTimer)
  muteToastTimer = setTimeout(() => muteToast.classList.remove('show'), 2200)
  if (isMuted) speechSynthesis.cancel()
}
muteBtn.addEventListener('click', () => { toggleMenu(false); toggleMute() })
document.getElementById('restart-btn').addEventListener('click', () => { toggleMenu(false); history = []; mainMenu() })

/* ══════════════════════════════════════════════════════
   TTS — UK Female voice (respects mute state)
══════════════════════════════════════════════════════ */
function loadVoice() {
  const voices = speechSynthesis.getVoices()
  const prefs = [
    v=>v.name==='Serena',
    v=>v.name==='Kate',
    v=>v.name.includes('Google UK English Female'),
    v=>v.lang==='en-GB'&&/female/i.test(v.name),
    v=>v.lang==='en-GB',
    v=>v.lang.startsWith('en')
  ]
  for (const fn of prefs) { const f = voices.find(fn); if(f){ukV=f;break} }
}
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoice
loadVoice()

function speak(text) {
  if (isMuted) return
  speechSynthesis.cancel()
  const clean = text.replace(/<[^>]+>/g,' ').replace(/https?:\/\/\S+/g,' ').replace(/[^\w\s',.!?£\-]/g,' ').replace(/\s{2,}/g,' ').trim()
  if (!clean) return
  const u = new SpeechSynthesisUtterance(clean)
  if (ukV) u.voice = ukV; u.lang = 'en-GB'; u.rate = 0.9; u.pitch = 1.06
  speechSynthesis.speak(u)
}

/* ══════════════════════════════════════════════════════
   TEXT FORMATTING
   Lines starting "1." / "2)" become a numbered step card.
══════════════════════════════════════════════════════ */
function formatText(text) {
  const lines = text.split('\n')
  let html = '', steps = []
  const flush = () => {
    if (!steps.length) return
    html += '<ol class="steps">' + steps.map((s, i) => `<li><span class="n">${i + 1}</span><span>${s}</span></li>`).join('') + '</ol>'
    steps = []
  }
  lines.forEach((line, i) => {
    const m = line.match(/^\s*\d+[.)]\s+(.*)$/)
    if (m) { steps.push(m[1]); return }
    if (steps.length && !line.trim()) return
    flush()
    html += line + (i < lines.length - 1 ? '<br>' : '')
  })
  flush()
  return html.replace(/(<br>){3,}/g, '<br><br>')
}

    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},
      body:JSON.stringify({message:text, history}),
    })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    const d = await res.json()
    if (d.error) {
      bot('Sorry, something went wrong. Please try again.', ['🏠 Main Menu','Contact Us'])
    } else {
      history = d.history || history
      const chips = Array.isArray(d.items) ? [...d.items] : []
      if (!chips.some(c => (typeof c === 'string' ? c : c.text || '').includes('Main Menu'))) chips.push('🏠 Main Menu')
      bot(d.reply, chips)
      humanCard()
    }
  } catch(e) {
    console.error('[Zovie]', e)
    bot("I couldn't reach the server. Please check your connection.", ['🏠 Main Menu'])
  }
  setBusy(false)
}

/* ══════════════════════════════════════════════════════
   SEND — unified handler
══════════════════════════════════════════════════════ */
function sendMessage(override) {
  if (isBusy) return
  const text = (override !== undefined ? override : inp.value).trim()
  if (!text) return
  inp.value = ''; inp.style.height = 'auto'

  if (RESET_WORDS.has(text.toLowerCase().trim())) {
    history = []; mainMenu(); return
  }

  userBubble(text)
  route(text)
}

sendBtn.onclick = () => sendMessage()
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
})

/* ══════════════════════════════════════════════════════
   RATING WIDGET
══════════════════════════════════════════════════════ */
function showRating(closeAfter = false) {
  if (document.querySelector('.rating-wrap')) return
  bot('Thanks for chatting with Zovie today! 😊 How was your experience?')
  setTimeout(() => {
    const wrap = document.createElement('div'); wrap.className = 'rating-wrap'
    wrap.innerHTML = `
      <div class="rt">Rate your experience</div>
      <div class="rs">Tap a star to rate Zovie</div>
      <div class="star-row">
        <button class="star" data-i="1" aria-label="1 star">★</button>
        <button class="star" data-i="2" aria-label="2 stars">★</button>
        <button class="star" data-i="3" aria-label="3 stars">★</button>
        <button class="star" data-i="4" aria-label="4 stars">★</button>
        <button class="star" data-i="5" aria-label="5 stars">★</button>
      </div>
      <div class="feedback-form" id="zrf">
        <div class="fi-lbl">Tell us more</div>
        <input  class="fi-inp" id="zrn" placeholder="Full name">
        <input  class="fi-inp" id="zrp" placeholder="Phone number">
        <input  class="fi-inp" id="zre" placeholder="Email address">
        <textarea class="fi-inp" id="zrm" rows="3" placeholder="Tell us how we can improve…"></textarea>
        <button class="fi-submit" id="zrb">Send Feedback</button>
      </div>`
    put(wrap); scroll()

    document.getElementById('zrb').onclick = () => submitRating(closeAfter)
    wrap.querySelectorAll('.star').forEach(btn => {
      btn.onclick = () => {
        selectedRating = parseInt(btn.dataset.i)
        wrap.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < selectedRating))
        if (selectedRating >= 4) {
          bot('Brilliant — thank you so much! ⭐ Have a wonderful day! 👋')
          if (closeAfter) setTimeout(() => hidePanel(), 2800)
        } else {
          document.getElementById('zrf').style.display = 'block'; scroll()
        }
      }
    })
  }, 900)
}

async function submitRating(closeAfter = false) {
  const btn = document.getElementById('zrb'); if(!btn) return
  btn.disabled = true; btn.textContent = 'Sending…'
  try {
    await fetch('/api/feedback', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},
      body:JSON.stringify({
        rating: selectedRating,
        name:   (document.getElementById('zrn')||{}).value || '',
        phone:  (document.getElementById('zrp')||{}).value || '',
        email:  (document.getElementById('zre')||{}).value || '',
        message:(document.getElementById('zrm')||{}).value || '',
      }),
    })
  } catch(e) { console.error(e) }
  bot('Thank you! 🙏 A member of our team will be in touch shortly.')
  if (closeAfter) setTimeout(() => hidePanel(), 2800)
}

/* ══════════════════════════════════════════════════════
   SPEECH RECOGNITION
══════════════════════════════════════════════════════ */
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition
  recog = new SR()
  recog.lang = 'en-GB'; recog.continuous = false; recog.interimResults = false; recog.maxAlternatives = 1
  recog.onstart  = () => { isListening=true;  micBtn.classList.add('listening');    micSt.textContent='🎙️ Listening… speak now' }
  recog.onend    = () => { isListening=false; micBtn.classList.remove('listening'); setTimeout(()=>micSt.textContent='',3000) }
  recog.onerror  = e  => { isListening=false; micBtn.classList.remove('listening'); micSt.textContent=e.error==='no-speech'?'No speech detected.':'Mic error: '+e.error; setTimeout(()=>micSt.textContent='',3500) }
  recog.onresult = e  => { const t=e.results[0][0].transcript.trim(); micSt.textContent=`✅ Heard: "${t}"`; sendMessage(t) }
}
micBtn.onclick = () => {
  if (!recog) { micSt.textContent='Speech not supported in this browser.'; setTimeout(()=>micSt.textContent='',3000); return }
  if (isListening) recog.stop()
  else try { recog.start() } catch(e) { micSt.textContent='Mic busy — try again.' }
}

/* ══════════════════════════════════════════════════════
   OPEN / CLOSE
══════════════════════════════════════════════════════ */
function openChat() {
  dot.style.display = 'none'
  const cb = document.getElementById('chatbot')
  cb.style.display = 'flex'; isOpen = true
  requestAnimationFrame(() => cb.classList.add('open','visible'))
  if (!started) { started = true; mainMenu() }
  setTimeout(() => inp.focus(), 380)
}
function closeChat() {
  const cb = document.getElementById('chatbot')
  cb.classList.remove('visible'); isOpen = false
  setTimeout(() => { cb.classList.remove('open'); cb.style.display = 'none' }, 330)
  speechSynthesis.cancel()
  if (recog && isListening) recog.stop()
}

fab.onclick = () => isOpen ? closeChat() : openChat()
/* Minimise keeps the conversation; close also starts a fresh chat next time. */
minB.onclick = () => hidePanel()
closeB.onclick = () => { hidePanel(); history = []; setTimeout(mainMenu, 350) }
document.addEventListener('click', e => {
  if (!EMBED && isOpen && !document.getElementById('chatbot').contains(e.target) && !fab.contains(e.target)) closeChat()
})
fab.addEventListener('click', e => e.stopPropagation())

/* ── Plan "Buy this plan" links respect embed navigation ── */
msgs.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('.plan-buy')
  if (a) { e.preventDefault(); openUrl(a.getAttribute('href')) }
})

/* ══════════════════════════════════════════════════════
   EMBED MODE
   The website provides its own floating toggle, so hide ours
   and open the chat straight away.
══════════════════════════════════════════════════════ */
if (EMBED) {
  document.body.classList.add('embed')
  openChat()
}
</script>
